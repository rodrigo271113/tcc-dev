<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3 Nested Treemap Experiment</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <h1>Repository Treemap (D3.js Nested)</h1>
    <p class="subtitle">Nested treemap with drill-down. Colors represent Pony Factor (Red = High Risk).</p>

    <div class="controls">
        <span class="label">Directory sizing:</span>
        <label><input type="radio" name="sizemode" value="linear" checked> Faithful (linear)</label>
        <label><input type="radio" name="sizemode" value="log"> Compressed (log, per-level)</label>
    </div>

    <div class="search-wrap">
        <input id="search" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search files &amp; folders&hellip; (Enter to go, Esc to close)">
        <div id="search-results"></div>
    </div>

    <div id="treemap-container">
        <div id="loading">Calculating Full Project Layout...</div>
        <div id="breadcrumb" class="breadcrumb">
            <span id="bc-text">Fetching data...</span>
            <span style="font-size:12px">Click a folder to zoom in &middot; click breadcrumb to zoom out &uarr;</span>
        </div>
        <div id="chart"></div>
    </div>

    <div class="legend">
        <span><i style="background:#ef4444"></i> TF &le; 1 (high risk)</span>
        <span><i style="background:#eab308"></i> TF &le; 2</span>
        <span><i style="background:#22c55e"></i> TF &le; 5</span>
        <span><i style="background:#94a3b8"></i> TF &gt; 5 (low risk)</span>
    </div>

    <div id="tooltip"></div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
